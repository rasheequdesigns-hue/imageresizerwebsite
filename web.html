<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Resizer - Pro Image Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-checker { background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-10">
    <header class="bg-white border-b p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Studio<span class="text-indigo-600">Resizer</span></h1>
            <button onclick="location.reload()" class="text-sm text-gray-500 hover:text-indigo-600"><i class="fa-solid fa-rotate-right mr-1"></i> Reset</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <aside class="lg:col-span-4 space-y-4">
            <div id="upload-box" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 transition-all bg-white">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-500 mb-2"></i>
                <p class="font-medium">Upload Image</p>
                <p class="text-xs text-gray-400">JPG, PNG, WEBP</p>
            </div>

            <div id="controls-container" class="hidden bg-white p-5 rounded-xl shadow-sm border space-y-4">
                <h3 class="font-bold text-gray-700">Settings</h3>
                
                <div>
                    <label class="text-xs font-bold text-gray-500">Filename</label>
                    <input type="text" id="output-filename" class="w-full border rounded p-2 text-sm mt-1">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-bold text-gray-500">Width (px)</label>
                        <input type="number" id="input-width" class="w-full border rounded p-2 text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">Height (px)</label>
                        <input type="number" id="input-height" class="w-full border rounded p-2 text-sm">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500">File Format</label>
                    <select id="output-format" class="w-full border rounded p-2 text-sm mt-1">
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WEBP</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <input type="number" id="target-size-input" class="w-full border rounded p-2 text-sm" placeholder="Target Size">
                    <select id="target-size-unit" class="border rounded p-2 text-sm">
                        <option value="1024">KB</option>
                        <option value="1048576">MB</option>
                    </select>
                </div>
                
                <button id="btn-process" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition">Apply Changes</button>
            </div>
        </aside>

        <section class="lg:col-span-8 space-y-4">
            <div id="preview-area" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl border">
                    <p class="text-xs text-gray-400 mb-2 font-bold uppercase">Original</p>
                    <img id="original-preview" class="w-full h-48 object-contain bg-checker rounded">
                    <p id="original-info" class="text-xs mt-2"></p>
                </div>
                <div class="bg-white p-4 rounded-xl border-2 border-indigo-200">
                    <p class="text-xs text-indigo-400 mb-2 font-bold uppercase">Processed</p>
                    <img id="processed-preview" class="w-full h-48 object-contain bg-checker rounded">
                    <p id="processed-info" class="text-xs mt-2 font-bold"></p>
                </div>
            </div>
            <button id="btn-download" class="hidden w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700">Download Image</button>
        </section>
    </main>

    <canvas id="processing-canvas" class="hidden"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            const uploadBox = document.getElementById('upload-box');
            const btnProcess = document.getElementById('btn-process');
            const btnDownload = document.getElementById('btn-download');
            const canvas = document.getElementById('processing-canvas');
            
            let currentImage = null;
            let processedBlob = null;

            uploadBox.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                if(e.target.files[0]) handleFile(e.target.files[0]);
            };

            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImage = new Image();
                    currentImage.onload = () => {
                        document.getElementById('original-preview').src = currentImage.src;
                        document.getElementById('input-width').value = currentImage.width;
                        document.getElementById('input-height').value = currentImage.height;
                        document.getElementById('output-filename').value = file.name.split('.')[0];
                        document.getElementById('controls-container').classList.remove('hidden');
                        document.getElementById('preview-area').classList.remove('hidden');
                        document.getElementById('original-info').textContent = `Size: ${Math.round(file.size/1024)} KB | ${currentImage.width}x${currentImage.height}px`;
                    };
                    currentImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            btnProcess.onclick = async () => {
                const w = parseInt(document.getElementById('input-width').value);
                const h = parseInt(document.getElementById('input-height').value);
                const format = document.getElementById('output-format').value;
                const targetBytes = parseInt(document.getElementById('target-size-input').value) * parseInt(document.getElementById('target-size-unit').value);
                
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(currentImage, 0, 0, w, h);
                
                canvas.toBlob((blob) => {
                    let finalBlob = blob;
                    if (blob.size < targetBytes) {
                        const padding = new Uint8Array(targetBytes - blob.size);
                        finalBlob = new Blob([blob, padding], { type: format });
                    }
                    processedBlob = finalBlob;
                    document.getElementById('processed-preview').src = URL.createObjectURL(finalBlob);
                    document.getElementById('processed-info').textContent = `Size: ${Math.round(finalBlob.size/1024)} KB`;
                    btnDownload.classList.remove('hidden');
                }, format, 0.9);
            };

            btnDownload.onclick = () => {
                const extMap = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp' };
                const format = document.getElementById('output-format').value;
                const link = document.createElement('a');
                link.href = URL.createObjectURL(processedBlob);
                link.download = document.getElementById('output-filename').value + (extMap[format] || '.jpg');
                link.click();
            };
        });
    </script>
</body>
</html>
